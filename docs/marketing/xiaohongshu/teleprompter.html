<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>光集 · 提词器</title>
<!--
  Open this in Chrome, put the window at the top of your screen right under the camera (or on a tablet next to the lens),
  and read it as if you were telling a friend. Don't memorise it: say it in your own words, redo any sentence you like.

    Space  start / pause (3-2-1 first)      ↑ ↓  faster / slower      + −  text size
    M      mirror (for a real teleprompter glass)      R  back to the start      H  hide / show the help

  Edit the words in LINES below. A line in 【】 is a slot for something only you can say.
-->
<style>
:root{--text:#f2f0e8;--dim:#5d5b54;--bg:#0b0b0c}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",sans-serif;-webkit-font-smoothing:antialiased}
#stage{position:absolute;inset:0;overflow:hidden}
#text{position:absolute;left:50%;top:0;width:min(880px,88vw);transform:translateX(-50%);will-change:transform}
.line{font-size:var(--size,56px);line-height:1.45;font-weight:700;margin:0 0 .9em;color:var(--dim);transition:color .25s}
.line.now{color:var(--text)}
.line.slot{font-weight:500;font-style:italic}
body.mirror #text{transform:translateX(-50%) scaleX(-1)}
/* where your eyes should rest: a thin marker on the left edge, a third of the way down */
#eye{position:absolute;left:0;top:30%;width:34px;height:3px;background:#f2f0e8;opacity:.6}
#count{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:220px;font-weight:800;background:rgba(11,11,12,.88)}
#help{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);font-size:14px;color:#9a978d;white-space:nowrap;transition:opacity .3s}
body.playing #help{opacity:0}
#pos{position:fixed;right:18px;top:14px;font-size:14px;color:#6c6a62}
</style>
</head>
<body>
<div id="stage"><div id="text"></div><div id="eye"></div></div>
<div id="count"></div><div id="pos"></div>
<div id="help">空格 开始/暂停 · ↑↓ 速度 · +− 字号 · M 镜像 · R 重来</div>
<script>
const LINES = [
  "你用 DJI 拍完素材，想在 Mac 上调色，",
  "有没有发现：DJI Mimo，只有手机版？",
  "我也遇到过。Lightroom、Photoshop 当然能做，",
  "可第一次打开，全是看不懂的滑块。",
  "所以我做了个小工具，叫「光集」。",
  "点一下「自动」，它会先看这张照片，",
  "再帮你调好明暗和颜色。不满意，一键撤销。",
  "预设，直接用你自己的照片预览，喜欢哪个，点哪个。",
  "裁剪，也是直接在照片上拖。",
  "调完，直接存进「照片」，iPhone 上就能看到。",
  "视频，还能做成实况照片。",
  "【这里说一句只有你能说的：你最喜欢哪个功能，或者做它时最意外的一件事】",
  "还有件有意思的事：这个 App，最早的原型是 ChatGPT 写的，",
  "后来我用 Claude Code，一点点改成现在的样子。",
  "每一次改动，几乎都只是我说了一句人话，",
  "比如「这个蓝色太亮了」，比如「方框太多了」。",
  "现在还是早期版本，只有 Apple 芯片的 Mac 能用。",
  "想试试的，评论区告诉我；",
  "你也在用 AI 做东西的话，也来聊聊。"
];
// Long story versions (docs/marketing/script-long.md): ?v=long-zh or ?v=long-en. Default: the short script above,
// whose keywords build-talking-video.py listens for.
const LONG = {"long-zh": ["我拍了一段很喜欢的素材。", "回到家，想在 Mac 的大屏幕上，把颜色调一调。", "然后我发现了一件很奇怪的事。", "DJI 的调色 App，Mimo，只有手机版。", "想在大屏幕上调，就得把素材传回手机，在一块小小的屏幕上，一点一点地抠。", "那就用专业软件吧。", "Lightroom、Photoshop 当然什么都能做，", "可是第一次打开，迎面就是几十个滑块。", "曝光、高光、阴影、白色、黑色、去朦胧……", "我不知道先动哪一个，也不知道动完，到底是变好了还是变坏了。", "【这里说一句你当时的真实感受，比如：那一刻我只想把照片调好看，并不想先上一门课。】", "所以我想：能不能有一个工具，", "在 Mac 上，简单得像手机 App；", "想学的时候，又有人在旁边，把道理讲给你听？", "最早的一版原型，是 ChatGPT 帮我写的。它能跑，但又慢、又乱。", "后来我把它交给 Claude Code，第一件事不是加功能，而是挑毛病，而且每个毛病都在我的 Mac 上实测：", "一个有两千个文件的文件夹，原来加进素材库要将近 7 秒，界面直接卡住；现在，不到一百分之一秒。", "DJI Pocket 3 官方的 LUT，原来根本导不进来，因为文件里的标题是另一种中文编码；现在，能正常用了。", "做的过程里，最让我意外的是：", "几乎每一次改动，都是从我的一句普通的话开始的。", "「这个蓝色太亮了。」", "「右边太松了，不够紧凑。」", "「信息不够。」", "「方框太多了。」", "我说一句，AI 改一版，我再看，再说。一轮一轮。", "当然，AI 也会错，而且错得很像回事。", "有一张白桌子上的拿铁，它说这张照片「整体偏亮」，建议我把曝光降一档半。", "可是白桌子，本来就应该是亮的呀。", "这种错，只有你真的去用、真的去看，才会发现。发现了，就改掉，再加上测试，保证它不会再犯。", "【这里可以说一句你对「和 AI 一起做东西」的体会，比如：它很快，但哪里好看、哪里不对，还是得我来拍板。】", "那它现在能做什么呢？我直接给你看。", "导入一个文件夹，或者直接把照片拖进窗口。", "点一下「自动」，它会先读这张照片，再替你调好明暗和颜色。", "它很克制：白底的照片保持明亮，夜景还是夜景，日落的暖色会留下来。不满意，按一下撤销就回去了。", "想自己调，默认只有六个滑块：亮度、对比度、亮部、暗部、冷暖、鲜艳度。每一个，都有一句人话告诉你它是干什么的。", "预设，不是一排看不懂的名字，而是直接用你这张照片做成的小图，喜欢哪个，点哪个。", "裁剪，就直接在照片上拖。", "调完，直接存进 Mac 的「照片」。开着 iCloud，你的 iPhone 上马上就能看到。", "视频，还能剪成三秒以内，做成真正的实况照片。", "但我最想做好的，其实是另一件事。", "一键滤镜能让照片变好看，可是下一次，你还是不知道为什么。", "抖音上有一位摄影博主，张小样，他用动画讲直方图、讲曲线、讲光圈，比任何说明书都清楚。", "可惜，他只有几条视频，讲不完所有的基础。", "所以，我们把这种讲法，放进了 App 里。", "用你自己的照片：看它怎样碎成一个个像素，再按亮度堆成一座小山，那就是直方图；", "拖一拖光圈，看背景怎样慢慢变虚；", "拖一下「亮部」，直方图上会亮出它到底改了哪一段。", "现在一共有十三课，从直方图、曝光、曲线，到白平衡、光圈、焦距，还有视频的帧率和 Log。", "文字和动画，都是我们自己写、自己画的，而且还在一课一课地往上加。", "它叫 Lucet 光集。", "Lucet 是拉丁语，意思是「它在发光」。", "光集，是把光收集起来。", "一张照片，本来就是被留住的光。", "最后说几句实在的。", "它现在还是早期版本：只能在 Apple 芯片的 Mac 上用，需要 macOS 15 以上，界面目前只有中文。还没有经过苹果的公证，第一次打开，要在系统设置里手动放行一次。", "它不会改动你的原片，没有账号，也不会上传你的任何照片。", "如果你也有一堆舍不得删、又不知道怎么调的照片，欢迎来试试。", "哪里不顺手，哪里看不懂，都告诉我。", "你要是也在用 AI 做自己的东西，也来聊聊，我们互相看看。", "让每一个瞬间，自有光彩。"],
  "long-en": ["I shot some footage I really loved.", "I got home, opened my Mac, and wanted to do one simple thing: make the colours look right.", "And then I ran into something strange.", "DJI's editing app, Mimo, only exists on phones.", "So to grade on a big screen, I'd have to send everything back to my phone and nudge sliders on a tiny screen.", "Fine — use the pro tools, then.", "Lightroom and Photoshop can do anything.", "But the first time you open them, you're staring at dozens of sliders.", "Exposure, highlights, shadows, whites, blacks, dehaze…", "I didn't know which one to touch first, or whether I'd just made it better or worse.", "【Your honest feeling, in one line — e.g. \"I just wanted a nice photo. I didn't want to take a course first.\"】", "So I wondered: could there be a tool that's as simple as a phone app, but on the Mac —", "and that, when you're curious, actually explains why?", "The very first prototype was written by ChatGPT. It ran, but it was slow and messy.", "Then I took it into Claude Code, and the first job wasn't adding features. It was finding problems — and measuring every one of them on my Mac.", "Adding a folder with two thousand files used to take almost seven seconds and freeze the whole window. Now it's under a hundredth of a second.", "DJI's own LUTs for the Pocket 3 wouldn't even import, because of how their titles were encoded. Now they just work.", "The part that surprised me most:", "almost every change started with one plain sentence from me.", "\"This blue is too bright.\"", "\"The right side feels loose.\"", "\"There isn't enough information here.\"", "\"Too many boxes.\"", "I'd say it, the AI would try something, I'd look, and say the next thing. Round after round.", "And yes — the AI gets things wrong, and it can sound very sure of itself.", "It once looked at a latte on a white table and told me the photo was \"too bright\", and suggested pulling the exposure down by a stop and a half.", "But a white table is supposed to be bright.", "You only catch that kind of mistake by actually using the thing. So we fixed it, and added a test so it can't come back.", "【One line on what working with AI felt like for you — e.g. \"It's fast, but deciding what looks right is still my job.\"】", "So what can it actually do? Let me just show you.", "Drag in a folder, or a few photos.", "Press Auto. It reads this particular photo first, then fixes the light and colour.", "It's restrained on purpose: a bright white scene stays bright, a night shot stays a night shot, a sunset keeps its warmth. Don't like it? Undo, and you're back.", "If you want to adjust it yourself, there are just six sliders by default: brightness, contrast, highlights, shadows, warmth, and vibrance. Each one comes with a plain sentence about what it does.", "Presets aren't a list of mysterious names — each one is a little preview made from your photo. Pick the one you like.", "Cropping? Just drag on the photo.", "When you're done, it saves straight into Photos on your Mac. With iCloud Photos on, it's on your iPhone a moment later.", "And video clips under three seconds can become real Live Photos.", "But the thing I care about most is something else.", "A one-tap filter can make a photo look better — and next time, you still don't know why.", "There's a photography creator on Douyin, Zhang Xiaoyang, who explains histograms, curves and aperture with animation, more clearly than any manual I've read.", "But he's only made a handful of videos. They can't cover all the basics.", "So we brought that way of teaching into the app — using your own photos.", "Watch your picture break into pixels and pile up by brightness into a little mountain: that's a histogram.", "Drag the aperture and watch the background soften.", "Drag \"highlights\", and the histogram lights up exactly the part it's changing.", "There are thirteen lessons now — histograms, exposure, curves, white balance, aperture, focal length, even frame rate and Log footage for video.", "Every word and every animation is our own, and we're still adding lessons one at a time.", "It's called Lucet.", "Lūcet is Latin for \"it shines\".", "Its Chinese name, 光集, means \"gathering light\".", "Because a photo is just that: light you decided to keep.", "A few honest things before you go.", "It's an early version. It runs on Apple-silicon Macs with macOS 15 or later, and right now the interface is in Chinese only. It isn't notarized by Apple yet, so the first time you open it, you'll need to allow it once in System Settings.", "It never changes your originals. There's no account, and none of your photos are uploaded anywhere.", "If you've got a folder of photos you can't bring yourself to delete, but don't know how to fix — come and try it.", "Tell me where it's confusing, or where it gets in your way.", "And if you're building your own thing with AI, tell me about it. I'd love to see what you're making.", "Let your moments shine."]};
const chosen = LONG[new URLSearchParams(location.search).get("v")] || LINES;
const box = document.getElementById("text");
chosen.forEach(t => { const p = document.createElement("p"); p.className = "line" + (t.startsWith("【") ? " slot" : ""); p.textContent = t; box.appendChild(p); });
const lines = [...box.children];
let y = 0, speed = 46, size = 56, playing = false, last = 0, counting = false;
const stage = document.getElementById("stage"), pos = document.getElementById("pos");
function apply() {
  document.documentElement.style.setProperty("--size", size + "px");
  const start = innerHeight * 0.30;                       // the first line begins at the eye marker
  box.style.top = start - y + "px";
  const mid = innerHeight * 0.30 + 40;
  lines.forEach(l => { const r = l.offsetTop + start - y; l.classList.toggle("now", r < mid + 30 && r + l.offsetHeight > mid - 30); });
  pos.textContent = `速度 ${speed}`;
}
function frame(ts) {
  if (playing) { y += speed * (ts - last) / 1000; const end = box.scrollHeight; if (y > end) { y = end; toggle(); } apply(); }
  last = ts; requestAnimationFrame(frame);
}
function toggle() {
  if (counting) return;
  if (playing) { playing = false; document.body.classList.remove("playing"); return; }
  counting = true; const c = document.getElementById("count"); c.style.display = "flex"; let n = 3; c.textContent = n;
  const tick = setInterval(() => { n--; if (n > 0) c.textContent = n; else { clearInterval(tick); c.style.display = "none"; counting = false; playing = true; document.body.classList.add("playing"); last = performance.now(); } }, 1000);
}
addEventListener("keydown", e => {
  if (e.code === "Space") { e.preventDefault(); toggle(); }
  else if (e.key === "ArrowUp") { speed = Math.min(140, speed + 6); apply(); }
  else if (e.key === "ArrowDown") { speed = Math.max(12, speed - 6); apply(); }
  else if (e.key === "+" || e.key === "=") { size = Math.min(96, size + 4); apply(); }
  else if (e.key === "-") { size = Math.max(32, size - 4); apply(); }
  else if (e.key === "m" || e.key === "M") document.body.classList.toggle("mirror");
  else if (e.key === "r" || e.key === "R") { y = 0; playing = false; document.body.classList.remove("playing"); apply(); }
});
addEventListener("resize", apply); apply(); requestAnimationFrame(frame);
</script>
</body>
</html>
